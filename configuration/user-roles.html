<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles - Geopima Agencies</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Core Dashboard & Page Specific Styles -->
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="user-roles.css">
</head>
<body>

  <div class="roles-wrapper">
    <!-- Top Header & Breadcrumb -->
    <div class="top-page-header">
      <h2>ROLES</h2>
      <div class="breadcrumb-trail">
        <a href="../configuration.html">Home</a> / Authentication
      </div>
    </div>

    <!-- Main Content Card -->
    <div class="roles-card">
      <!-- Action Bar Header -->
      <div class="roles-card-header">
        <div class="roles-card-title">
          <i class="fa-solid fa-user-gear"></i> User Roles
        </div>
        <div class="action-group">
          <button class="btn-top-permissions" id="permissionsBtn">
            <i class="fa-solid fa-key"></i> Permissions
          </button>
          <button class="btn-top-new-role" id="newRoleBtn">
            <i class="fa-solid fa-gear"></i> New Role
          </button>
        </div>
      </div>

      <!-- Controls: Entries & Search -->
      <div class="table-controls-row">
        <div class="entries-selector">
          Show 
          <select id="entriesDropdown">
            <option value="10">10</option>
            <option value="25">25</option>
          </select> 
          entries
        </div>
        <div class="search-box-wrapper">
          Search: <input type="text" id="rolesSearch" placeholder="">
        </div>
      </div>

      <!-- Table Container -->
      <table class="roles-table">
        <thead>
          <tr>
            <th class="col-num-header"># <i class="fa-solid fa-sort"></i></th>
            <th>NAME <i class="fa-solid fa-sort"></i></th>
            <th class="col-center">PERMISSION <i class="fa-solid fa-sort"></i></th>
            <th class="col-center">EDIT <i class="fa-solid fa-sort"></i></th>
            <th class="col-center">DELETE <i class="fa-solid fa-sort"></i></th>
          </tr>
        </thead>
        <tbody id="rolesTableBody">
          <!-- Populated dynamically via user-roles.js -->
        </tbody>
      </table>

      <!-- Footer & Pagination -->
      <div class="table-footer-row">
        <div id="tableInfoSummary">Showing 0 to 0 of 0 entries</div>
        <div class="pagination-group">
          <button class="page-link-btn" disabled>Previous</button>
          <button class="page-link-btn active">1</button>
          <button class="page-link-btn" disabled>Next</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared API Script & Page JS -->
  <script src="../js/api.js"></script>
  <script src="user-roles.js"></script>
</body>
</html>
